observer:
  enabled: true
reinforcement:
  # Maximum number of recent observation lines sent to the reinforcer agent per
  # Stop-hook invocation. Limits token cost for long sessions (the session JSONL
  # grows unbounded; capping to the last N lines covers near-real-time patterns
  # without transmitting the full history). Configurable per-project.
  recent_observations_window: 50
instincts:
  initial_confidence: 0.5
  reinforcement_increment: 0.05
  max_confidence: 1
  injection_threshold: 0.5
  max_injected: 10
  decay_per_run: 0.02
  decay_floor: 0
  propose_memory_threshold: 0.85
  auto_memory_threshold: 0.95
clustering:
  domain_threshold: 5
  min_confidence_for_clustering: 0.4
  min_grouping_size: 2
  rejection_overlap_threshold: 0.7
global_instincts:
  enabled: true
  auto_promote_threshold: 3
  propose_promote_threshold: 2
  initial_confidence: 0.5
  reinforcement_increment: 0.05
  max_confidence: 1
  injection_threshold: 0.5
  decay_per_run: 0.02
  decay_floor: 0
  max_injected: 10
  propose_memory_threshold: 0.85
  auto_memory_threshold: 0.95
graduation:
  max_per_run_per_scope: 10
  agent_model: claude-haiku-4-5-20251001
consolidation:
  # Merges redundant instincts/memories/proposals into comprehensive entries.
  # User-invoked via the /consolidate skill (manual-only; not chained into observe.sh).
  agent_model: claude-sonnet-4-6
  # Instinct candidate floor. Only instincts with confidence in
  # [min_confidence, propose_memory_threshold) are consolidated -- above that
  # ceiling they are graduation-owned (see instincts.propose_memory_threshold).
  min_confidence: 0.5
  # Minimum entries required to form a merge group.
  min_group_size: 2
  # Cap on merge groups staged per scope per pass in a single analysis run.
  max_per_run: 10
observations:
  max_tool_response_length: 500
  max_observations_per_run: 200
  tool_denylist:
    - Read
    - Glob
    - Grep
    - ToolSearch
  tool_allowlist: []
